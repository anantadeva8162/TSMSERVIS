<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Peserta Servis Gratis - SMKN 1 Doko</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:
    radial-gradient(circle at 10% 10%,rgba(0,145,255,.25),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(0,220,255,.15),transparent 30%),
    linear-gradient(135deg,#06101d,#0b1d32 55%,#07111e);
  padding:25px 15px;
}
.container{max-width:900px;margin:auto}
.hero,.card{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(9,22,38,.86);
  backdrop-filter:blur(16px);
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}
.hero{padding:42px;border-radius:28px}
.badge{display:inline-block;padding:8px 13px;border-radius:999px;background:rgba(60,200,255,.1);color:#7edfff;font-size:12px;font-weight:bold;letter-spacing:1px;margin-bottom:18px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.04}
h1 span{display:block;color:#49c6ff}
.hero p{margin-top:15px;color:#b9c8d8;line-height:1.7}
.card{margin-top:20px;padding:30px;border-radius:26px}
.title{display:flex;gap:12px;align-items:center;margin-bottom:25px}
.icon{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#087df0,#29c5ff);font-size:21px}
.title h2{font-size:20px}.title p{font-size:13px;color:#8495a9;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.full{grid-column:1/-1}
label{display:block;margin-bottom:8px;font-size:13px;font-weight:bold;color:#dce7f2}
.req{color:#ff7186}
.input{width:100%;height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:#fff;padding:0 16px;outline:none;font-size:14px}
.input:focus{border-color:#37baff;box-shadow:0 0 0 4px rgba(55,186,255,.1)}
.hint{font-size:11px;color:#718196;margin-top:7px}
button{width:100%;height:56px;margin-top:25px;border:0;border-radius:15px;background:linear-gradient(110deg,#0879ef,#21baff);color:white;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 30px rgba(22,131,255,.25)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:15px;padding:14px;border-radius:13px;font-size:13px;line-height:1.5}
.success{display:block;background:rgba(40,210,125,.09);border:1px solid rgba(40,210,125,.25);color:#baf5d4}
.error{display:block;background:rgba(255,80,105,.09);border:1px solid rgba(255,80,105,.25);color:#ffc1ca}
.footer{text-align:center;color:#687a8f;font-size:11px;padding:20px}
@media(max-width:650px){.hero{padding:28px 21px}.card{padding:22px 17px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <div class="badge">🛠️ PROGRAM SERVIS GRATIS</div>
    <h1>DATA PESERTA SERVIS GRATIS <span>SMKN 1 DOKO</span></h1>
    <p>Silakan lengkapi data kendaraan dengan benar untuk mengikuti kegiatan servis gratis.</p>
  </section>

  <section class="card">
    <div class="title">
      <div class="icon">🚗</div>
      <div><h2>Formulir Peserta</h2><p>Semua data wajib diisi.</p></div>
    </div>

    <form id="form">
      <div class="grid">
        <div class="full">
          <label>Nama Lengkap <span class="req">*</span></label>
          <input class="input" id="nama" required placeholder="Masukkan nama lengkap">
        </div>

        <div>
          <label>Merk / Type Kendaraan <span class="req">*</span></label>
          <input class="input" id="merkType" required placeholder="Contoh: Honda Beat">
        </div>

        <div>
          <label>Nomor Polisi <span class="req">*</span></label>
          <input class="input" id="nomorPolisi" required placeholder="Contoh: AG 1234 XX">
        </div>

        <div class="full">
          <label>Nomor WhatsApp <span class="req">*</span></label>
          <input class="input" id="whatsapp" required inputmode="numeric" placeholder="Contoh: 081234567890">
          <div class="hint">Gunakan nomor WhatsApp yang aktif.</div>
        </div>
      </div>

      <button id="submit" type="submit">KIRIM PENDAFTARAN</button>
      <div id="msg" class="msg"></div>
    </form>
  </section>

  <div class="footer"><b>SMKN 1 DOKO</b><br>Data tersimpan otomatis ke sistem pendaftaran.</div>
</div>

<script>
/*
  URL Web App Google Apps Script Anda.
  Jika nanti membuat deployment baru, ganti URL di bawah.
*/
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwrhhS7VFrOi__IJ9B7ADVOjv2_1me8pzOuMWoCM7xzF70d2YyseNo0hHiMiO6tn-me/exec";

const form=document.getElementById("form");
const submit=document.getElementById("submit");
const msg=document.getElementById("msg");
const nomorPolisi=document.getElementById("nomorPolisi");
const whatsapp=document.getElementById("whatsapp");

nomorPolisi.addEventListener("input",()=>nomorPolisi.value=nomorPolisi.value.toUpperCase());
whatsapp.addEventListener("input",()=>whatsapp.value=whatsapp.value.replace(/[^0-9]/g,""));

function show(type,text){
  msg.className="msg "+type;
  msg.textContent=text;
  msg.style.display="block";
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();

  const data={
    nama:document.getElementById("nama").value.trim(),
    merkType:document.getElementById("merkType").value.trim(),
    nomorPolisi:nomorPolisi.value.trim().toUpperCase(),
    whatsapp:whatsapp.value.trim()
  };

  if(!data.nama||!data.merkType||!data.nomorPolisi||!data.whatsapp){
    show("error","Semua kolom wajib diisi.");
    return;
  }

  if(!/^(08|628)[0-9]{8,13}$/.test(data.whatsapp)){
    show("error","Nomor WhatsApp tidak valid. Contoh: 081234567890.");
    return;
  }

  submit.disabled=true;
  submit.textContent="MENGIRIM DATA...";
  msg.style.display="none";

  try{
    const body=new URLSearchParams(data);

    /*
      mode no-cors digunakan agar website GitHub Pages
      dapat mengirim POST ke Google Apps Script.
      Google Apps Script tetap menerima dan menyimpan data.
    */
    await fetch(WEB_APP_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body:body.toString()
    });

    show("success","✓ Pendaftaran berhasil dikirim. Terima kasih!");
    form.reset();

  }catch(error){
    show("error","Data gagal dikirim. Periksa koneksi internet lalu coba lagi.");
  }finally{
    submit.disabled=false;
    submit.textContent="KIRIM PENDAFTARAN";
  }
});
</script>
</body>
</html>
